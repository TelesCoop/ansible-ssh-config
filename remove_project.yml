---
# Removes a project from a host: the inverse of deploying it.
#
# Every destructive step is preceded by a backup, and the two irreversible ones
# (database, system account) are opt-in.
#
#   ansible-playbook -i hosts remove_project.yml --limit vps05 \
#     -e project_slug=datatlas_prod -e confirm_project=datatlas_prod
#
#   add -e remove_database=true to drop the database and its role
#   add -e remove_system_user=true to drop the system account and its home
#
- name: Remove a project from a host
  hosts: all
  become: yes

  vars:
    remove_database: false
    remove_system_user: false
    database_name: "{{ project_slug }}"
    # Static sites often name the vhost after the domain, not the directory.
    nginx_vhost_name: "{{ project_slug }}"
    backup_directory: "/var/backups/project-removal/{{ project_slug }}"
    # A role suffix carries no separator of its own, which is what tells
    # "<slug>-backend" apart from the neighbouring "<slug>-preprod-backend".
    config_pattern: "^{{ project_slug | regex_escape }}([-_][a-z0-9]+)?\\.conf$"

  tasks:
    # -------------------------------
    # Guards
    # -------------------------------
    - name: Require an explicit project
      assert:
        that:
          - project_slug is defined
          - project_slug is string
          - project_slug is match('^[a-z0-9][a-z0-9_-]*$')
        fail_msg: >-
          Nommer le projet : -e project_slug=<nom>
          (minuscules, chiffres, tirets et soulignés uniquement)

    # A typo here deletes the wrong project, so the name must be given twice.
    - name: Require the confirmation to match the project
      assert:
        that: confirm_project | default('') == project_slug
        fail_msg: >-
          Confirmer la suppression : -e confirm_project={{ project_slug }}

    # Without --limit this play would run the whole sequence on every host.
    - name: Require a single target host
      assert:
        that: ansible_play_hosts | length == 1
        fail_msg: >-
          Cibler un seul serveur avec --limit (actuellement :
          {{ ansible_play_hosts | join(', ') }})

    # -------------------------------
    # What is actually there
    # -------------------------------
    - name: Find the supervisor configurations of this project
      find:
        paths: /etc/supervisor/conf.d
        patterns: "{{ config_pattern }}"
        use_regex: true
      register: supervisor_configs
      check_mode: false

    # Anything sharing the prefix but not matching belongs to another project or
    # carries a composite role name; it is reported, never touched.
    - name: Find the neighbouring configurations left untouched
      find:
        paths: /etc/supervisor/conf.d
        patterns: "{{ project_slug }}*"
      register: neighbour_configs
      check_mode: false

    - name: Read the programs declared by those configurations
      shell:
        cmd: "grep -ho '^\\[program:[^]]*\\]' {{ supervisor_configs.files | map(attribute='path') | map('quote') | join(' ') }} | sed 's/\\[program:\\(.*\\)\\]/\\1/'"
      register: declared_programs
      changed_when: false
      check_mode: false
      when: supervisor_configs.files | length > 0

    - name: Find the project directories
      stat:
        path: "{{ item }}"
      loop:
        - "/telescoop/{{ project_slug }}"
        - "/usr/local/telescoop/{{ project_slug }}"
        - "/var/log/telescoop/{{ project_slug }}"
      register: project_directories
      check_mode: false

    - name: Check whether the nginx vhost exists
      stat:
        path: "/etc/nginx/sites-enabled/{{ nginx_vhost_name }}"
      register: nginx_vhost
      check_mode: false

    - name: Read the domains served by the vhost
      shell:
        cmd: "grep -hoP '^\\s*server_name\\s+\\K[^;]+' /etc/nginx/sites-enabled/{{ nginx_vhost_name }} | tr ' ' '\\n' | grep -v '^$' | sort -u"
      register: vhost_domains
      changed_when: false
      check_mode: false
      when: nginx_vhost.stat.exists

    - name: Find the nginx logs of those domains
      find:
        paths: /var/log/nginx
        patterns: "*{{ item | replace('.', '_') }}.log*"
      loop: "{{ vhost_domains.stdout_lines | default([]) }}"
      register: nginx_logs
      check_mode: false

    # A certificate shared with another site must not be deleted, so its own
    # domain list decides.
    - name: Read the domains each certificate covers
      shell:
        cmd: "certbot certificates --cert-name {{ item | quote }} 2>/dev/null | grep -oP 'Domains:\\s*\\K.*' || true"
      loop: "{{ vhost_domains.stdout_lines | default([]) }}"
      register: certificate_domains
      changed_when: false
      check_mode: false

    - name: Report what will be removed
      debug:
        msg:
          - "programmes : {{ declared_programs.stdout_lines | default([]) }}"
          - "configurations : {{ supervisor_configs.files | map(attribute='path') | map('basename') | list }}"
          - "répertoires : {{ project_directories.results | selectattr('stat.exists') | map(attribute='item') | list }}"
          - "vhost nginx : {{ 'oui' if nginx_vhost.stat.exists else 'non' }}"
          - "domaines : {{ vhost_domains.stdout_lines | default([]) }}"
          - "journaux nginx : {{ nginx_logs.results | default([]) | map(attribute='files') | flatten | length }} fichier(s), non sauvegardés"
          - "certificats supprimés : {{ certificate_domains.results | default([]) | selectattr('stdout', 'truthy') | selectattr('stdout', 'search', '.') | map(attribute='item') | list }}"
          - "NON TOUCHÉ (autres projets ou rôles composés) : {{ neighbour_configs.files | map(attribute='path') | map('basename') | reject('in', supervisor_configs.files | map(attribute='path') | map('basename') | list) | list }}"
          - "base de données : {{ 'supprimée' if remove_database | bool else 'conservée' }}"
          - >-
            {{ 'ATTENTION : un vhost existe mais aucun fichier ni programme ne porte ce nom.
            Vérifier le slug (-e project_slug=) et le vhost (-e nginx_vhost_name=).'
            if nginx_vhost.stat.exists
               and supervisor_configs.files | length == 0
               and (project_directories.results | selectattr('stat.exists') | list | length) == 0
            else '' }}
          - "compte système : {{ 'supprimé' if remove_system_user | bool else 'conservé' }}"

    - name: Create the backup directory
      file:
        path: "{{ backup_directory }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    # -------------------------------
    # Back up before destroying
    # -------------------------------
    - name: Back up the supervisor configurations
      copy:
        src: "{{ item.path }}"
        dest: "{{ backup_directory }}/"
        remote_src: true
        mode: '0600'
      loop: "{{ supervisor_configs.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # The enabled entry is often a symlink; follow it rather than guess its target.
    - name: Back up the nginx vhost
      copy:
        src: "{{ nginx_vhost.stat.lnk_source | default('/etc/nginx/sites-enabled/' + nginx_vhost_name) }}"
        dest: "{{ backup_directory }}/"
        remote_src: true
        mode: '0600'
      when: nginx_vhost.stat.exists

    - name: Check whether the database exists
      community.postgresql.postgresql_query:
        db: postgres
        query: "SELECT 1 FROM pg_database WHERE datname = %(name)s"
        named_args:
          name: "{{ database_name }}"
      become_user: postgres
      register: database_present
      changed_when: false
      check_mode: false

    # Dumped even when the database is kept: it is the only safety net if someone
    # later reruns this playbook with remove_database=true. Written to /tmp first
    # because the redirect runs as postgres, which cannot write the backup dir.
    - name: Dump the database
      shell:
        cmd: "pg_dump -Fc {{ database_name | quote }} > /tmp/{{ database_name }}.dump"
      become_user: postgres
      when: database_present.rowcount | default(0) > 0
      changed_when: true

    - name: Move the dump into the backups
      command:
        cmd: "mv /tmp/{{ database_name }}.dump {{ backup_directory }}/"
        removes: "/tmp/{{ database_name }}.dump"
      when: database_present.rowcount | default(0) > 0

    # -------------------------------
    # Stop and remove the services
    # -------------------------------
    # Removing each program by name leaves any other pending config change on the
    # host alone, which "supervisorctl update" would have applied.
    - name: Stop and remove the supervisor programs
      command:
        cmd: "supervisorctl {{ item[0] }} {{ item[1] }}"
      loop: "{{ ['stop', 'remove'] | product(declared_programs.stdout_lines | default([])) | list }}"
      loop_control:
        label: "{{ item[0] }} {{ item[1] }}"
      register: supervisor_removal
      failed_when:
        - supervisor_removal.rc != 0
        - "'no such process' not in supervisor_removal.stdout | lower"

    - name: Remove the supervisor configurations
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ supervisor_configs.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Disable the nginx vhost
      file:
        path: "/etc/nginx/sites-enabled/{{ nginx_vhost_name }}"
        state: absent
      when: nginx_vhost.stat.exists
      notify: Reload nginx

    - name: Remove the scheduled jobs
      shell:
        cmd: "crontab -r -u {{ project_slug | quote }} 2>/dev/null || true"
      changed_when: false

    # nginx must let go of the vhost before the files disappear, and well before
    # a database drop that may fail and stop the play.
    - name: Apply the service changes now
      meta: flush_handlers

    # -------------------------------
    # Remove the files
    # -------------------------------
    - name: Remove the nginx vhost definition
      file:
        path: "/etc/nginx/sites-available/{{ nginx_vhost_name }}"
        state: absent

    # Not backed up: they run to hundreds of megabytes and serve no purpose once
    # the project is gone.
    - name: Remove the nginx logs
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ nginx_logs.results | default([]) | map(attribute='files') | flatten }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # Left in place, its weekly renewal would fail for a domain that no longer
    # resolves. Only removed when every domain it covers belongs to this project.
    - name: Remove the certificates covering only this project
      command:
        cmd: "certbot delete --cert-name {{ item.item | quote }} --non-interactive"
      loop: "{{ certificate_domains.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stdout | default('') | length > 0
        - item.stdout.split() | difference(vhost_domains.stdout_lines | default([])) | length == 0

    - name: Report the certificates left alone
      debug:
        msg: >-
          Certificat {{ item.item }} conservé : il couvre aussi
          {{ item.stdout.split() | difference(vhost_domains.stdout_lines | default([])) | join(', ') }}
      loop: "{{ certificate_domains.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stdout | default('') | length > 0
        - item.stdout.split() | difference(vhost_domains.stdout_lines | default([])) | length > 0

    - name: Remove the project directories
      file:
        path: "{{ item.item }}"
        state: absent
      loop: "{{ project_directories.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists

    # -------------------------------
    # Irreversible, opt-in
    # -------------------------------
    - name: Drop the database
      community.postgresql.postgresql_db:
        name: "{{ database_name }}"
        state: absent
        force: true
      become_user: postgres
      when:
        - remove_database | bool
        - database_present.rowcount | default(0) > 0

    # A role can hold privileges on server parameters, which blocks the drop
    # until they are revoked.
    - name: Revoke the role's parameter privileges
      command:
        cmd: "psql -c 'REVOKE ALL ON PARAMETER session_replication_role FROM {{ database_name }}'"
      become_user: postgres
      when: remove_database | bool
      failed_when: false
      changed_when: false

    - name: Drop the database role
      community.postgresql.postgresql_user:
        name: "{{ database_name }}"
        state: absent
      become_user: postgres
      when: remove_database | bool
      register: role_removal
      failed_when:
        - role_removal.failed | default(false)
        - "'does not exist' not in role_removal.msg | default('')"

    - name: Check the system account before removing it
      getent:
        database: passwd
        key: "{{ project_slug }}"
      register: system_account
      failed_when: false
      when: remove_system_user | bool

    # Refuses to run when the home is shared, which would wipe every project.
    - name: Remove the system account and its home
      user:
        name: "{{ project_slug }}"
        state: absent
        remove: "{{ (system_account.ansible_facts.getent_passwd[project_slug][4] | default('')) is match('^/home/' + project_slug) }}"
      when:
        - remove_system_user | bool
        - system_account.ansible_facts.getent_passwd[project_slug] is defined

    - name: Report what remains
      debug:
        msg:
          - "Projet {{ project_slug }} retiré de {{ inventory_hostname }}."
          - "Sauvegardes : {{ backup_directory }}"
          - >-
            {{ 'Base et rôle supprimés (dump conservé).'
               if remove_database | bool
               else ('Base conservée, dump réalisé.'
                     if database_present.rowcount | default(0) > 0
                     else 'Aucune base de ce nom.') }}
          - "Penser à retirer l'entrée DNS."

  handlers:
    - name: Reload nginx
      shell:
        cmd: "nginx -t && systemctl reload nginx"
